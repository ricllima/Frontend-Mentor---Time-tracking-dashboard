<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Frontend Mentor | Time tracking dashboard</title>
    <meta
      name="description"
      content="A time tracking dashboard that allows the user to view daily, weekly or monthly statistics for different activities"
    />
  </head>
  <body>
    <main>
      <div class="report">
        <div class="user">
          <div class="user-avatar">
            <img
              width="58"
              height="58"
              src="/images/image-jeremy.png"
              alt="Picture of Jeremy Robson"
            />
          </div>

          <div class="user-name">
            <p>Report for</p>
            <h1>Jeremy Robson</h1>
          </div>
        </div>

        <div class="timeframes">
          <button>Daily</button>
          <button data-selected="">Weekly</button>
          <button>Monthly</button>
        </div>
      </div>

      <div class="activity work">
        <div class="content">
          <div class="name">
            <p>Work</p>
          </div>

          <div class="options">
            <button aria-label="Work activity options">
              <img
                width="21"
                height="5"
                src="/images/icon-ellipsis.svg"
                alt=""
              />
            </button>
          </div>

          <div class="current-time">
            <p>N/A</p>
          </div>

          <div class="previous-time">
            <p>N/A</p>
          </div>
        </div>
      </div>

      <div class="activity play">
        <div class="content">
          <div class="name">
            <p>Play</p>
          </div>

          <div class="options">
            <button aria-label="Play activity options">
              <img
                width="21"
                height="5"
                src="/images/icon-ellipsis.svg"
                alt=""
              />
            </button>
          </div>

          <div class="current-time">
            <p>N/A</p>
          </div>

          <div class="previous-time">
            <p>N/A</p>
          </div>
        </div>
      </div>

      <div class="activity study">
        <div class="content">
          <div class="name">
            <p>Study</p>
          </div>

          <div class="options">
            <button aria-label="Study activity options">
              <img
                width="21"
                height="5"
                src="/images/icon-ellipsis.svg"
                alt=""
              />
            </button>
          </div>

          <div class="current-time">
            <p>N/A</p>
          </div>

          <div class="previous-time">
            <p>N/A</p>
          </div>
        </div>
      </div>

      <div class="activity exercise">
        <div class="content">
          <div class="name">
            <p>Exercise</p>
          </div>

          <div class="options">
            <button aria-label="Exercise activity options">
              <img
                width="21"
                height="5"
                src="/images/icon-ellipsis.svg"
                alt=""
              />
            </button>
          </div>

          <div class="current-time">
            <p>N/A</p>
          </div>

          <div class="previous-time">
            <p>N/A</p>
          </div>
        </div>
      </div>

      <div class="activity social">
        <div class="content">
          <div class="name">
            <p>Social</p>
          </div>

          <div class="options">
            <button aria-label="Social activity options">
              <img
                width="21"
                height="5"
                src="/images/icon-ellipsis.svg"
                alt=""
              />
            </button>
          </div>

          <div class="current-time">
            <p>N/A</p>
          </div>

          <div class="previous-time">
            <p>N/A</p>
          </div>
        </div>
      </div>

      <div class="activity self-care">
        <div class="content">
          <div class="name">
            <p>Self Care</p>
          </div>

          <div class="options">
            <button aria-label="Self Care activity options">
              <img
                width="21"
                height="5"
                src="/images/icon-ellipsis.svg"
                alt=""
              />
            </button>
          </div>

          <div class="current-time">
            <p>N/A</p>
          </div>

          <div class="previous-time">
            <p>N/A</p>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
